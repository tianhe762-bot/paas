services:
  paas:
    build: .
    image: paas:latest
    container_name: paas
    restart: unless-stopped
    # 与宿主机共享网络：容器流量走宿主机的 fake-ip 透明代理（Telegram 等被代理域名可直连）
    network_mode: host
    # 网页端"更新与卸载"需要访问宿主机 Docker socket，容器以 root 运行（个人自用服务器）
    user: root
    env_file: .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      TELEGRAM_PROXY: ${TELEGRAM_PROXY:-}
      PAAS_HOST_PROJECT: ${PAAS_HOST_PROJECT:-/opt/paas}
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      # 网页端"更新与卸载"需要访问宿主机 Docker 与项目目录（见 README 安全说明）
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PAAS_HOST_PROJECT:-/opt/paas}:/host-paas:ro
      - ${PAAS_HOST_PROJECT:-/opt/paas}/data:/host-paas-data

  # 可选本地 AI：启用方式 docker compose --profile ai up -d
  ollama:
    image: ollama/ollama:latest
    container_name: paas-ollama
    restart: unless-stopped
    profiles: ["ai"]
    network_mode: host
    volumes:
      - ./data/ollama:/root/.ollama
